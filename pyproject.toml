[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caspianx"
version = "0.1.0"
description = "Simulation-only agent infrastructure and evaluation toolkit"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "openai>=1.50,<3",
    "python-dotenv>=1,<2",
    "peewee>=3.17,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.7,<1"]
ui = ["streamlit>=1.39,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D104"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*", "config*", "core*", "dashboard*", "evaluation*",
    "integrations*", "llm*", "memory*", "research*", "safety*",
    "storage*",
]
exclude = ["tests*", "docs*", "data*"]
namespaces = false
